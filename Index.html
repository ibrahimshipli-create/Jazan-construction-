}

function renderDashboard() {
    return `
        <div class="grid">
            <div class="stat-card"><h3>إجمالي</h3><div class="value">${state.requests.length}</div></div>
            <div class="stat-card"><h3>انتظار</h3><div class="value">${state.requests.filter(r => r.status === 'قيد الانتظار').length}</div></div>
            <div class="stat-card"><h3>تنفيذ</h3><div class="value">${state.requests.filter(r => r.status === 'قيد التنفيذ').length}</div></div>

        </div>
    `;
}

function renderRequests() {
    const filtered = state.requests.filter(r => {
        const cat = state.filterCategory === 'all' || r.category === state.filterCategory;
        const search = !state.searchTerm || r.number.includes(state.searchTerm);
        return cat && search;
    });

    return `
        <div class="toolbar">
            <button class="btn-primary" onclick="openModal()">+ طلب جديد</button>
            <input type="search" id="search" placeholder="ابحث..." oninput="search()">
            <select id="filter" onchange="filterCat()">
                <option value="all">جميع الأقسام</option>
                ${Object.keys(data.projectTypes).map(cat => `<option value="${cat}">${cat}</option>`).join('')}
            </select>
            <button class="btn-primary" onclick="exportCSV()">تصدير</button>
        </div>

        <div class="table-container">
            <table>
                <thead><tr>
                    <th>رقم الطلب</th><th>النوع</th><th>المقاول</th><th>التاريخ</th><th>النسبة</th><th>الحالة</th><th>ملفات</th><th>إجراء</th>
                </tr></thead>
                <tbody>
                    ${filtered.length === 0 ? '<tr><td colspan="8" style="text-align:center">لا توجد طلبات</td></tr>' : 
                    filtered.map(r => `
                        <tr>
                            <td>${r.number}</td>
                            <td>${r.category}</td>
                            <td>${r.contractor}</td>
                            <td>${r.date}</td>
                            <td>${r.percentage}%</td>
                            <td><span class="status status-${r.status.replace(/\s+/g, '-').toLowerCase()}">${r.status}</span></td>
                            <td>${r.files ? r.files.length : 0}</td>
                            <td><button class="action-btn" onclick="editReq(${r.id})">✏️</button>
                                <button class="action-btn delete" onclick="deleteReq(${r.id})">🗑️</button></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function renderReports() {
    return `
        <div class="grid">
            ${Object.keys(data.projectTypes).map(cat => `
                <div class="stat-card">
                    <h3>${cat}</h3>
                    <div class="value">${state.requests.filter(r => r.category === cat).length}</div>
                    <button class="btn-primary" style="margin-top:15px; width:100%" onclick="exportCat('${cat}')">تصدير</button>

}

}

function login(name, role) { state.loggedIn = true; state.user = name; state.activeTab = ‘dashboard’; render(); }
function logout() { state.loggedIn = false; state.user = null; render(); }
function switchTab(tab) { state.activeTab = tab; state.filterCategory = ‘all’; state.searchTerm = ‘’; render(); }
function openModal() { state.showModal = true; state.editId = null; state.newFiles = []; render(); }
function closeModal() { state.showModal = false; state.editId = null; state.newFiles = []; render(); }
function editReq(id) { state.editId = id; state.showModal = true; state.newFiles = []; render(); }
function deleteReq(id) { if(confirm(‘حذف؟’)) { state.requests = state.requests.filter(r => r.id !== id); render(); } }
function search() { state.searchTerm = document.getElementById(‘search’).value; render(); }
function filterCat() { state.filterCategory = document.getElementById(‘filter’).value; render(); }

function handleFiles(e) {
const files = Array.from(e.target.files).map(f => ({ name: f.name, size: f.size }));
state.newFiles = […(state.newFiles || []), …files];
renderFileList();
}

function renderFileList() {
const list = document.getElementById(‘fileList’);
if (list) {
list.innerHTML = state.newFiles.map((f, i) => `<div class="file-item"> <span>📄 ${f.name}</span> <button type="button" class="btn-remove" onclick="removeFile(${i})">حذف</button> </div>`).join(’’);
}
}

function removeFile(i) { state.newFiles.splice(i, 1); renderFileList(); }

function saveRequest(e) {
e.preventDefault();
const req = {
id: state.editId || Date.now(),
number: document.getElementById(‘number’).value,
category: document.getElementById(‘category’).value,

percentage: parseInt(document.getElementById(‘percentage’).value),

notes: document.getElementById(‘notes’).value,
files: state.newFiles
};

}

function exportCSV() {
const filtered = state.requests.filter(r => state.filterCategory === ‘all’ || r.category === state.filterCategory);
let csv = ‘\uFEFF’ + ‘رقم,النوع,المقاول,الاستشاري,التاريخ,النسبة,الحالة,عدد الملفات\n’;
filtered.forEach(r => {
csv += `${r.number},${r.category},${r.contractor},${r.consultant},${r.date},${r.percentage}%,${r.status},${r.files ? r.files.length : 0}\n`;
});
const blob = new Blob([csv], { type: ‘text/csv;charset=utf-8’ });
const link = document.createElement(‘a’);
link.href = URL.createObjectURL(blob);
link.download = ‘تقرير.csv’;
link.click();
}

function exportCat(cat) {
const filtered = state.requests.filter(r => r.category === cat);
let csv = ‘\uFEFF’ + ‘رقم,النوع,المقاول,الاستشاري,التاريخ,النسبة,الحالة\n’;
filtered.forEach(r => {
csv += `${r.number},${r.category},${r.contractor},${r.consultant},${r.date},${r.percentage}%,${r.status}\n`;
});
const blob = new Blob([csv], { type: ‘text/csv;charset=utf-8’ });
const link = document.createElement(‘a’);
link.href = URL.createObjectURL(blob);
link.download = `تقرير-${cat}.csv`;
link.click();
}

render();
</script>
